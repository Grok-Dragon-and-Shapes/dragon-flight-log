<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Журнал полётов дракона</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<main class='layout'>
  <header>
    <h1>Журнал полётов дракона</h1>
    <p class='sub'>Полёты над биомами: высота и заметки. Данные хранятся в этом браузере.</p>
  </header>

  <section class='card'>
    <div id='stats' class='stats' aria-live='polite'></div>
  </section>

  <section class='card'>
    <h2>Новый полёт</h2>
    <form id='addForm' class='add-form'>
      <label>Дата
        <input id='date' type='date' required>
      </label>
      <label>Биом
        <select id='biome' required></select>
      </label>
      <label>Высота, блоков
        <input id='altitude' type='number' min='0' max='400' step='1' required>
      </label>
      <label>Заметка
        <input id='note' type='text' maxlength='200' placeholder='Что видел внизу'>
      </label>
      <button type='submit'>Записать полёт</button>
    </form>
    <p id='formError' class='error' role='alert'></p>
  </section>

  <section class='card'>
    <h2>Журнал</h2>
    <ul id='list' class='list'></ul>
    <p id='empty' class='muted' hidden>Полётов пока нет.</p>
  </section>
</main>
<script src='app.js'></script>
</body>
</html>
